[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tennis-viz"
version = "0.1.0"
description = "Tennis match visualization tool"
dependencies = [
    "numpy",
    "pandas",
    "vpython",
    "requests"
]

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
tennis-viz = "tennis_viz.app:main"